name: Backend CI & Database Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Migrate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: worklog_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/worklog_test_db?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/worklog_test_db?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Push Schema to Test Database
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/worklog_test_db?schema=public
        run: node ./node_modules/prisma/build/index.js db push --skip-generate

      - name: Seed Database
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/worklog_test_db?schema=public
        run: npm run prisma:seed

      - name: Run Authentication & Access Control Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/worklog_test_db?schema=public
          JWT_SECRET: test-super-secret-jwt-key-for-ci-pipeline
          PORT: 5001
          NODE_ENV: test
        run: npm run test:auth
