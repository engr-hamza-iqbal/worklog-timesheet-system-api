services:
  - type: web
    name: worklog-timesheet-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CORS_ORIGIN
        value: '*'
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
